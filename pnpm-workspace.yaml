  # too), published 2026-09-02; dev-only accessibility checks of the frontend's
  # end-to-end suite, never shipped, listed in licenses-policy.toml
  # [flagged-accepted] (verified 2026-09-23).
  "@axe-core/playwright": 4.13.0
