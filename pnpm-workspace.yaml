packages:
  - apps/*
  - packages/*
  - tools/eval
# pnpm 11: dependency lifecycle scripts run only when listed here (strictDepBuilds defaults to true).
# Add an entry in its own `build(deps):` commit and name the reason.
# esbuild: its postinstall only re-links the platform binary that the optional
# @esbuild/<platform> package already ships, so the script is not needed.
# cpu-features, protobufjs, ssh2: reached through testcontainers 12.1.0 ->
# docker-modem. ssh2 builds cpu-features only to speed up its SSH transport,
# and the Docker daemon is reached over the local socket; protobufjs' script
# only regenerates wrappers its published tarball already ships.
# onnxruntime-node: its install script downloads and unpacks the prebuilt
# runtime for the current platform, which is the whole point of the package —
# the backend's in-process embedding runtime cannot load a model without it.
# msw: its postinstall only copies the browser service worker into the
# `msw.workerDirectory` a package.json names; the frontend runs msw in Node
# through `setupServer` and names none, so the script has nothing to do.
allowBuilds:
  cpu-features: false
  esbuild: false
  msw: false
  onnxruntime-node: true
  protobufjs: false
  ssh2: false
