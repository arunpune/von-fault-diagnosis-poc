name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For a larger change, agreeing on the approach here before you open a pull request
        saves everyone time. The ground rules in
        [CONTRIBUTING.md](https://github.com/meddleconnect/jev-fault-diagnosis-poc/blob/main/CONTRIBUTING.md#ground-rules)
        apply to every change, for example no third-party manuals, no real brand names and ground truth kept out of the
        diagnosis.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen, and which part of the stack it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
