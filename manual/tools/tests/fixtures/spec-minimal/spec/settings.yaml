#
# Test fixture: the six programmable settings the fixture alarms reference.
schema_version: 1
settings:
  - id: cut_in_pressure
    param_no: P01
    name: Cut-in pressure
    unit: bar
    type: number
    min: 5.0
    default: 8.0
    max: 9.5
    step: 0.1
    access: operator
    signal: line_pressure
    description: Line pressure at which the controller loads the compressor.
    used_by: [regulation]
    constraints:
      - {relation: lte, other: cut_out_pressure, margin: -0.5, text: must stay below the cut-out pressure by the regulation margin}
  - id: cut_out_pressure
    param_no: P02
    name: Cut-out pressure
    unit: bar
    type: number
    min: 6.0
    default: 10.0
    max: 11.0
    step: 0.1
    access: operator
    signal: line_pressure
    description: Line pressure at which the controller unloads the compressor.
    used_by: [regulation]
    constraints:
      - {relation: gte, other: cut_in_pressure, margin: 0.5, text: must stay above the cut-in pressure by the regulation margin}
      - {relation: lte, other: machine.ratings.max_working_pressure, text: must not exceed the maximum working pressure}
  - id: motor_start_mask_time
    param_no: P05
    name: Motor start mask time
    unit: s
    type: integer
    min: 5
    default: 15
    max: 60
    step: 1
    access: service
    description: Time after a motor start during which the controller ignores load-dependent messages.
    used_by: [alarm_evaluation]
  - id: oil_temperature_warning
    param_no: P09
    name: Oil temperature warning
    unit: degC
    type: number
    min: 60
    default: 75
    max: 90
    step: 1
    access: service
    signal: oil_temperature
    description: Oil temperature at which the controller raises the high oil temperature warning.
    constraints:
      - {relation: lt, other: oil_temperature_shutdown_warning, text: must stay below the shutdown warning limit}
  - id: oil_temperature_shutdown_warning
    param_no: P10
    name: Oil temperature shutdown warning
    unit: degC
    type: number
    min: 70
    default: 85
    max: 100
    step: 1
    access: service
    signal: oil_temperature
    description: Oil temperature at which the controller announces an approaching shutdown.
    constraints:
      - {relation: gt, other: oil_temperature_warning, text: must stay above the warning limit}
      - {relation: lt, other: oil_temperature_shutdown, text: must stay below the shutdown limit}
  - id: oil_temperature_shutdown
    param_no: P11
    name: Oil temperature shutdown
    unit: degC
    type: number
    min: 80
    default: 95
    max: 110
    step: 1
    access: service
    signal: oil_temperature
    description: Oil temperature at which the controller stops the unit.
    constraints:
      - {relation: gt, other: oil_temperature_shutdown_warning, text: must stay above the shutdown warning limit}
