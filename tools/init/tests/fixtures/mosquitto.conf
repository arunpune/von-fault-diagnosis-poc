#
# Fallback broker configuration for the init integration fixtures.
# It is used only when `infra/mosquitto/` is not in
# the worktree; the real stack ships authenticated users and an ACL.
#
# Anonymous connects are allowed because the readiness wait sends a
# CONNECT with no credentials and never subscribes or publishes.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
persistence false
log_dest stdout
log_type warning
log_type error
connection_messages false
