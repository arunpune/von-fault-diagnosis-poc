#
# Dependency licence policy for `fdp-checks licenses`: a shipped dependency
# carries a permissive licence, never GPL or AGPL (docs/security.md).
#
# Scope decides the consequence, not the licence alone:
#
#   * runtime — anything that ships in a Compose image. An entry that is not
#     allowed stops the build.
#   * dev — build, lint, test and documentation tooling. Copyleft is listed
#     in the report and never fails, because none of it is distributed.
#
# Changing a list here changes what may ship. Add a licence only with the
# registry evidence for it, recorded in the commit that adds it.

[runtime]
# Permissive licences a shipped dependency may carry.
allow = [
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "0BSD",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "CC-BY-4.0",
  "PostgreSQL",
  "Python-2.0",
  "PSF-2.0",
  "OFL-1.1",
  "MIT-0",
  "MIT-CMU",
  "Zlib",
]

# Weak copyleft and public-domain dedications: listed, and a runtime entry
# fails unless [flagged-accepted] carries it with a reason.
flagged = [
  "MPL-2.0",
  "Unlicense",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
]

# Strong copyleft and non-commercial terms: a runtime entry fails outright.
# These are identifier prefixes, so "GPL-3.0-or-later" is covered while
# "LGPL-3.0-only" is not (it is flagged above) and "CC-BY-4.0" is not (it is
# allowed above).
deny_prefixes = ["GPL-", "AGPL-", "SSPL-", "EUPL-", "CC-BY-SA-", "CC-BY-NC-"]

# Runtime packages whose flagged licence a human accepted, with the reason.
# Key: "<ecosystem>:<name>". Each one is weak (file-level) copyleft or a
# public-domain dedication, is pulled in transitively rather than chosen, and
# is used as an unmodified library, so no source-disclosure duty reaches this
# repository. A shipped package may not be GPL/AGPL; none of these is
# GPL/AGPL/LGPL. The licence beside each name is the one its installed metadata
# declares, read off the package itself.
[flagged-accepted]
# Unlicense (public-domain dedication, more permissive than MIT). Transitive:
# standardwebhooks 1.1.1 <- @anthropic-ai/sdk 0.127.0, a runtime dependency of
# @fdp/backend. It was already in the tree as a dev
# dependency of @fdp/contracts; shipping the SDK is what moved it to runtime.
"node:fast-sha256" = "Unlicense public-domain dedication; transitive via standardwebhooks <- @anthropic-ai/sdk, unmodified"
# MPL-2.0. Transitive: requests <- huggingface-hub <- tokenizers 0.23.2, which
# fdp-init needs to read the model's tokenizer.json. MPL-2.0 is file-level
# copyleft over certifi's own files, which ship unmodified, so it is
# acceptable but flagged.
"python:certifi" = "MPL-2.0 CA bundle, file-level copyleft only; transitive via requests <- huggingface-hub <- tokenizers, unmodified"
# MPL-2.0 AND MIT. Same chain: huggingface-hub <- tokenizers.
"python:tqdm" = "MPL-2.0 AND MIT progress bar, file-level copyleft only; transitive via huggingface-hub <- tokenizers, unmodified"
# MPL-2.0, dev-only. @axe-core/playwright 4.13.0 and the axe-core ~4.13.0 it
# depends on run the accessibility checks of the frontend's end-to-end suite.
# A dev row never fails the check; the entries record that a human accepted the flag.
"node:@axe-core/playwright" = "dev-only accessibility checks, never shipped"
"node:axe-core" = "dev-only accessibility engine of @axe-core/playwright, never shipped"

# Packages whose registry metadata is blank, composite or not an SPDX
# expression, resolved once to the expression a human read off the package.
# Key: "<ecosystem>:<name>".
[overrides]
# pypdfium2 declares "BSD-3-Clause, Apache-2.0, dependency licenses", which
# names three things and parses as none of them. The library is Apache-2.0
# and the bundled PDFium is BSD-3-Clause; the wheel's BUILD_LICENSES/ belong
# in the image notices when tools/init starts shipping it.
"python:pypdfium2" = "Apache-2.0 OR BSD-3-Clause"
# go-licenses reports the bare `EPL-2.0` for github.com/eclipse/paho.golang,
# which is unaudited under the lists above, because GitHub cannot read the dual
# license out of the module. The LICENSE file of v0.23.0 states EPL-2.0 **and**
# EDL-1.0 (BSD-3-Clause); the repository elects the EDL-1.0 half, and NOTICE
# and services/modbus/README.md record that election. The override applies to
# exactly this version of the module.
"go:github.com/eclipse/paho.golang" = "EPL-2.0 OR BSD-3-Clause"
# The three prose licence strings the init runtime chain declares.
# Each was read off the wheel's own LICENSE and resolves to a licence
# [runtime] allow already carries.
# protobuf 7.36.2 (via onnxruntime) declares "3-Clause BSD License"; its
# LICENSE is the three-clause Google BSD text.
"python:protobuf" = "BSD-3-Clause"
# python-dateutil 2.9.0.post0 (via pg8000) declares "Dual License"; its LICENSE
# carries the Apache-2.0 grant and the BSD-3-Clause text, and states "The above
# BSD License Applies to all code, even that also covered by Apache 2.0".
"python:python-dateutil" = "Apache-2.0 OR BSD-3-Clause"
# scramp 1.4.17 (via pg8000) declares "MIT No Attribution", whose SPDX
# identifier is MIT-0; its classifier names MIT-0 outright.
"python:scramp" = "MIT-0"

# Dev-only tools that carry copyleft and are expected in the dev table. Names
# are matched case-insensitively against the package name in any ecosystem; the
# list documents intent, it does not change any verdict.
[dev-copyleft-expected]
names = ["reuse", "golangci-lint", "pyphen", "shellcheck"]
