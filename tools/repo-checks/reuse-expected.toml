#
# What `REUSE.toml` must resolve to. One representative path per licence class
# (CONTRIBUTING.md states which licence applies to which path), resolved
# through the file with last-match-wins by `fdp-checks reuse-order`.
#
# A path listed here need not exist yet: the subject is table resolution, not
# the tree, so the check works before the file itself is created.
#
# Add an entry when a change introduces a new licence class or a new data
# directory whose licence must not drift; keep `why` a sentence a reviewer can
# check against that table.

version = 1

