<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CAU-7 fault diagnosis</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/IBMPlexSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/IBMPlexSans-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Theme boot: set the theme class before the first paint so a dark page
      never flashes light. It reads the same versioned key as
      src/store/ui-prefs.ts and falls back to the system preference.
    -->
    <script>
      (function () {
        var theme = "system";
        try {
          var stored = JSON.parse(window.localStorage.getItem("fdp.ui:v1") || "null");
          if (stored && (stored.theme === "light" || stored.theme === "dark")) {
            theme = stored.theme;
          }
        } catch (e) {
          theme = "system";
        }
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
